name: Build and push to gh-pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# IMPORTANT: allow the action to push to the repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_PIN: ${{ secrets.VITE_ADMIN_PIN }}
          VITE_ORG_ID: ${{ secrets.VITE_ORG_ID }}
        run: npm run build

      - name: Prepare Pages extras
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Show dist contents (debug)
        run: |
          echo "== dist =="
          ls -la dist
          echo "== assets =="
          ls -la dist/assets || true

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # make the first push an orphan to avoid history issues (prevents exit 128)
          force_orphan: true
          # optional but nice:
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
