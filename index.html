<script>
  (function () {
    var wrong = "/bundy-kiosk/";
    var right = "/Bundy-kiosk/";
    if (location.pathname.startsWith(wrong)) {
      location.replace(location.origin + right + location.pathname.slice(wrong.length) + location.search + location.hash);
    }
  })();
</script>
